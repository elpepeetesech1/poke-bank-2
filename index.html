<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pokémon Bank: cajero automático. Ingresa tu PIN para consultar tu saldo y hacer movimientos.">
  <meta name="theme-color" content="#1b1f3b">
  <title>Pokémon Bank - Inicio de sesión</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.polished.css">
</head>

<body class="pantalla-login">
  <main class="container d-flex flex-column align-items-center justify-content-center min-vh-100">

    <section class="card tarjeta-login w-100" aria-labelledby="titulo-login">
      <div class="card-body p-4 p-md-5 text-center">
        <h1 class="h3" id="titulo-login">Pokémon Bank</h1>
        <p class="text-muted">Cajero automático</p>

        <form action="acciones.html" id="form-login" autocomplete="off">
          <div class="form-group">
            <label for="pin" class="font-weight-bold">Ingresa tu PIN de 4 dígitos</label>
            <input type="password" id="pin" name="pin" class="form-control form-control-lg campo-pin"
                   inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="••••"
                   autocomplete="off" aria-describedby="ayuda-pin" title="Exactamente 4 dígitos" required autofocus>
            <small id="ayuda-pin" class="form-text text-muted">Solo números, 4 dígitos.</small>
          </div>
          <button type="submit" id="btn-ingresar" class="btn btn-danger btn-block">Ingresar</button>
        </form>
      </div>
    </section>

    <footer>
      <p class="text-white mt-3 mb-0">Pokémon Bank &copy; 2026</p>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
