<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Bank - Inicio de sesión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="pantalla-login">
  <main class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card tarjeta-login w-100">
      <div class="card-body p-4 p-md-5 text-center">
        <span class="pokebola pokebola-grande mb-3"></span>
        <h1 class="marca h3 mb-1">Pokémon <span>Bank</span></h1>
        <p class="text-muted mb-4">Cajero automático</p>

        <form action="acciones.html" id="form-login">
          <div class="form-group">
            <label for="pin" class="font-weight-bold">Ingresa tu PIN de 4 dígitos</label>
            <input type="password" id="pin" class="form-control form-control-lg campo-pin"
                   inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="••••"
                   autocomplete="off" required>
            <small class="form-text text-muted">Solo números, 4 dígitos.</small>
          </div>
          <button type="submit" id="btn-ingresar" class="btn btn-pokemon btn-lg btn-block">Ingresar</button>
        </form>
      </div>
    </div>

    <p class="pie mt-3">Pokémon Bank &copy; 2026 · Proyecto de cátedra</p>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
