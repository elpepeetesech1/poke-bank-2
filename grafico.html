<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pokémon Bank: gráfico de depósitos, retiros y pagos de servicios.">
  <meta name="theme-color" content="#1b1f3b">
  <title>Pokémon Bank - Gráfico</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.polished.css">
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <nav class="navbar navbar-expand navbar-dark" aria-label="Navegación principal">
    <a class="navbar-brand" href="acciones.html">Pokémon Bank</a>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="acciones.html">Acciones</a></li>
      <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
      <li class="nav-item active"><a class="nav-link" href="grafico.html" aria-current="page">Gráfico</a></li>
      <li class="nav-item"><a class="nav-link" href="index.html" id="btn-salir">Salir</a></li>
    </ul>
  </nav>

  <main class="container my-4" id="contenido">
    <h1 class="h3 mb-3">Gráfico de transacciones</h1>

    <div id="grafico">
      <div class="contenedor-grafico">
        <canvas id="grafica" role="img"
                aria-label="Gráfico de dona: depósitos $800, retiros $300, servicios $105"></canvas>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    new Chart(document.getElementById("grafica"), {
      type: "doughnut",
      data: {
        labels: ["Depósitos", "Retiros", "Servicios"],
        datasets: [{
          data: [800, 300, 105],
          backgroundColor: ["#1b1f3b", "#e63946", "#ffcb05"],
          borderColor: "#eceef5",
          borderWidth: 3
        }]
      },
      options: {
        plugins: {
          legend: { position: "bottom" },
          tooltip: {
            callbacks: {
              label: (ctx) => " " + ctx.label + ": $" + ctx.parsed.toLocaleString("es-MX")
            }
          }
        }
      }
    });
  </script>

  <script src="js/app.js"></script>
</body>

</html>
