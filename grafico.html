<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Bank - Gráfico</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar navbar-expand navbar-dark">
    <a class="navbar-brand" href="acciones.html">Pokémon Bank</a>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="acciones.html">Acciones</a></li>
      <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
      <li class="nav-item active"><a class="nav-link" href="grafico.html">Gráfico</a></li>
      <li class="nav-item"><a class="nav-link" href="index.html" id="btn-salir">Salir</a></li>
    </ul>
  </nav>

  <main class="container my-4">
    <h1 class="h3">Gráfico de transacciones</h1>

    <div id="grafico">
      <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
      <div class="contenedor-grafico">
        <canvas id="grafica"></canvas>
      </div>
      <script>
        new Chart(document.getElementById("grafica"), {
          type: "doughnut",
          data: {
            labels: ["Depósitos", "Retiros", "Servicios"],
            datasets: [{ data: [800, 300, 105] }]
          }
        });
      </script>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
