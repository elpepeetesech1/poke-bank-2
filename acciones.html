<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pokémon Bank: deposita, retira, consulta tu saldo y paga servicios.">
  <meta name="theme-color" content="#1b1f3b">
  <title>Pokémon Bank - Acciones</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.polished.css">
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <nav class="navbar navbar-expand navbar-dark" aria-label="Navegación principal">
    <a class="navbar-brand" href="acciones.html">Pokémon Bank</a>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item active"><a class="nav-link" href="acciones.html" aria-current="page">Acciones</a></li>
      <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
      <li class="nav-item"><a class="nav-link" href="grafico.html">Gráfico</a></li>
      <li class="nav-item"><a class="nav-link" href="index.html" id="btn-salir">Salir</a></li>
    </ul>
  </nav>

  <main class="container my-4" id="contenido">

    <div class="alert alert-info" role="status">
      <h1 class="h4">Bienvenido, <span id="nombre-titular">Ash Ketchum</span></h1>
      <p class="mb-0">Número de cuenta: <strong id="numero-cuenta">0011-2233-44</strong></p>
    </div>

    <div class="row">

      <div class="col-md-6 mb-3">
        <section class="card h-100" aria-labelledby="titulo-deposito">
          <h2 class="card-header h6 mb-0" id="titulo-deposito">Depositar</h2>
          <div class="card-body">
            <form id="form-deposito">
              <div class="form-group">
                <label for="monto-deposito">Monto</label>
                <input type="number" id="monto-deposito" class="form-control" min="1" step="0.01"
                       inputmode="decimal" placeholder="0.00" required>
              </div>
              <button type="submit" id="btn-depositar" class="btn btn-success">Depositar</button>
            </form>
          </div>
        </section>
      </div>

      <div class="col-md-6 mb-3">
        <section class="card h-100" aria-labelledby="titulo-retiro">
          <h2 class="card-header h6 mb-0" id="titulo-retiro">Retirar</h2>
          <div class="card-body">
            <form id="form-retiro">
              <div class="form-group">
                <label for="monto-retiro">Monto</label>
                <input type="number" id="monto-retiro" class="form-control" min="1" step="0.01"
                       inputmode="decimal" placeholder="0.00" required>
              </div>
              <button type="submit" id="btn-retirar" class="btn btn-danger">Retirar</button>
            </form>
          </div>
        </section>
      </div>

      <div class="col-md-6 mb-3">
        <section class="card h-100" aria-labelledby="titulo-saldo">
          <h2 class="card-header h6 mb-0" id="titulo-saldo">Consultar saldo</h2>
          <div class="card-body">
            <p class="h3 saldo" id="saldo-consulta" aria-live="polite">$2,500.00</p>
            <button type="button" id="btn-consultar" class="btn btn-primary">Consultar saldo</button>
          </div>
        </section>
      </div>

      <div class="col-md-6 mb-3">
        <section class="card h-100" aria-labelledby="titulo-servicios">
          <h2 class="card-header h6 mb-0" id="titulo-servicios">Pagar servicios</h2>
          <div class="card-body">
            <form id="form-servicios">
              <div class="form-group">
                <label for="servicio">Servicio</label>
                <select id="servicio" class="form-control" required>
                  <option value="" selected disabled>Selecciona un servicio</option>
                  <option value="energia">Energía eléctrica</option>
                  <option value="internet">Internet</option>
                  <option value="telefonia">Telefonía</option>
                  <option value="agua">Agua potable</option>
                </select>
              </div>
              <div class="form-group">
                <label for="monto-servicio">Monto</label>
                <input type="number" id="monto-servicio" class="form-control" min="1" step="0.01"
                       inputmode="decimal" placeholder="0.00" required>
              </div>
              <button type="submit" id="btn-pagar" class="btn btn-warning">Pagar</button>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const moneda = new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" });
    const colorConfirmar = "#1b1f3b";

    function confirmar(titulo, texto) {
      Swal.fire({ title: titulo, text: texto, icon: "success", confirmButtonColor: colorConfirmar });
    }

    document.getElementById("form-deposito").addEventListener("submit", (e) => {
      e.preventDefault();
      const monto = Number(document.getElementById("monto-deposito").value);
      confirmar("Depósito realizado", "Se depositaron " + moneda.format(monto));
      e.target.reset();
    });

    document.getElementById("form-retiro").addEventListener("submit", (e) => {
      e.preventDefault();
      const monto = Number(document.getElementById("monto-retiro").value);
      confirmar("Transacción realizada", "Retiraste " + moneda.format(monto));
      e.target.reset();
    });

    document.getElementById("form-servicios").addEventListener("submit", (e) => {
      e.preventDefault();
      const lista = document.getElementById("servicio");
      const servicio = lista.options[lista.selectedIndex].text;
      const monto = Number(document.getElementById("monto-servicio").value);
      confirmar("Pago realizado", "Pagaste " + moneda.format(monto) + " de " + servicio);
      e.target.reset();
    });
  </script>

  <script src="js/app.js"></script>
</body>

</html>
