<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Bank - Acciones</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar navbar-expand navbar-dark">
    <a class="navbar-brand" href="acciones.html">Pokémon Bank</a>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item active"><a class="nav-link" href="acciones.html">Acciones</a></li>
      <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
      <li class="nav-item"><a class="nav-link" href="grafico.html">Gráfico</a></li>
      <li class="nav-item"><a class="nav-link" href="index.html" id="btn-salir">Salir</a></li>
    </ul>
  </nav>

  <main class="container my-4">

    <div class="alert alert-info">
      <h1 class="h4">Bienvenido, <span id="nombre-titular">Ash Ketchum</span></h1>
      <p class="mb-0">Número de cuenta: <strong id="numero-cuenta">0011-2233-44</strong></p>
    </div>

    <div class="row">

      <div class="col-md-6 mb-3">
        <div class="card">
          <div class="card-header">Depositar</div>
          <div class="card-body">
            <form id="form-deposito">
              <div class="form-group">
                <label for="monto-deposito">Monto</label>
                <input type="number" id="monto-deposito" class="form-control" min="1" step="0.01" required>
              </div>
              <button type="submit" id="btn-depositar" class="btn btn-success">Depositar</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-6 mb-3">
        <div class="card">
          <div class="card-header">Retirar</div>
          <div class="card-body">
            <form id="form-retiro">
              <div class="form-group">
                <label for="monto-retiro">Monto</label>
                <input type="number" id="monto-retiro" class="form-control" min="1" step="0.01" required>
              </div>
              <button type="submit" id="btn-retirar" class="btn btn-danger">Retirar</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-6 mb-3">
        <div class="card">
          <div class="card-header">Consultar saldo</div>
          <div class="card-body">
            <p class="h3" id="saldo-consulta">$2,500.00</p>
            <button type="button" id="btn-consultar" class="btn btn-primary">Consultar saldo</button>
          </div>
        </div>
      </div>

      <div class="col-md-6 mb-3">
        <div class="card">
          <div class="card-header">Pagar servicios</div>
          <div class="card-body">
            <form id="form-servicios">
              <div class="form-group">
                <label for="servicio">Servicio</label>
                <select id="servicio" class="form-control" required>
                  <option value="" selected disabled>Selecciona un servicio</option>
                  <option value="energia">Energía eléctrica</option>
                  <option value="internet">Internet</option>
                  <option value="telefonia">Telefonía</option>
                  <option value="agua">Agua potable</option>
                </select>
              </div>
              <div class="form-group">
                <label for="monto-servicio">Monto</label>
                <input type="number" id="monto-servicio" class="form-control" min="1" step="0.01" required>
              </div>
              <button type="submit" id="btn-pagar" class="btn btn-warning">Pagar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.getElementById("form-deposito").addEventListener("submit", (e) => {
      e.preventDefault();
      const monto = document.getElementById("monto-deposito").value;
      Swal.fire("Depósito realizado", "Se depositaron $" + monto, "success");
      e.target.reset();
    });

    document.getElementById("form-retiro").addEventListener("submit", (e) => {
      e.preventDefault();
      const monto = document.getElementById("monto-retiro").value;
      Swal.fire("Transacción realizada", "Retiraste $" + monto, "success");
      e.target.reset();
    });

    document.getElementById("form-servicios").addEventListener("submit", (e) => {
      e.preventDefault();
      const lista = document.getElementById("servicio");
      const servicio = lista.options[lista.selectedIndex].text;
      const monto = document.getElementById("monto-servicio").value;
      Swal.fire("Pago realizado", "Pagaste $" + monto + " de " + servicio, "success");
      e.target.reset();
    });
  </script>

  <script src="js/app.js"></script>
</body>

</html>
